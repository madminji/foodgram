[flake8]
ignore =
    W503
exclude =
    tests/,
    */migrations/,
    data/,
    venv/,
    env/,
    .venv/,
    docs/,
    frontend/,
    infra/
per-file-ignores =
    */settings.py:E501
max-line-length = 79

[isort]
profile = black
known_first_party = api,recipes,foodgram_backend
skip = migrations
line_length = 79
no_lines_before = LOCALFOLDER