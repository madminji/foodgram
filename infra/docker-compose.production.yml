volumes:
  pg_data_production:
  static_volume:
  media_volume:

services:
  db:
    image: postgres:13.10
    env_file: .env
    restart: unless-stopped
    volumes:
      - pg_data_production:/var/lib/postgresql/data

  backend:
    image: madminji/foodgram_backend
    env_file: .env
    restart: unless-stopped
    volumes:
      - static_volume:/backend_static
      - media_volume:/app/media
    depends_on:
      - db

  frontend:
    image: madminji/foodgram_frontend
    env_file: .env
    command: cp -r /app/build/. /frontend_static/
    volumes:
      - static_volume:/frontend_static

  gateway:
    image: madminji/foodgram_gateway
    env_file: .env
    restart: unless-stopped
    volumes:
      - static_volume:/staticfiles/
      - media_volume:/app/media/
    ports:
      - 7000:80
    depends_on:
      - backend
      - frontend